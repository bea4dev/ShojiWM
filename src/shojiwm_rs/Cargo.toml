# !tyml @cargo/Cargo
[package]
name = "shojiwm_rs"
version = "0.1.0"
edition = "2024"

# Config runtime for ShojiWM configs written in Rust. Library only: a config
# crate depends on this and builds its own binary.
[dependencies]
shojiwm_lib = { path = "../shojiwm_lib" }
serde_json = "1.0.140"
tracing = "0.1.41"

[dev-dependencies]
smithay = { workspace = true }
wayland-client = "0.31.14"
wayland-protocols = { version = "0.32.12", features = ["client"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["client"] }
wayland-protocols-plasma = { version = "0.3.12", features = ["client"] }
