# !tyml @cargo/Cargo
[package]
name = "shoji_wm"
version = "0.1.0"
edition = "2024"

[dependencies]
bitflags = "2.11.0"
thiserror = "2.0.12"
smithay = {
    git = "https://github.com/bea4dev/smithay.git",
    rev = "ba8ca4e62a318ac23a9b0f271f201c71d7c39a01",
    features = ["use_system_lib", "xwayland"]
}
smithay-drm-extras = {
    git = "https://github.com/bea4dev/smithay.git",
    rev = "ba8ca4e62a318ac23a9b0f271f201c71d7c39a01",
    package = "smithay-drm-extras",
    default-features = false
}
wayland-protocols = { version = "0.32.12", features = ["server", "staging"] }
wayland-protocols-wlr = { version = "0.3.12", features = ["server"] }
wayland-server = { version = "0.31.13", features = ["libwayland_1_23"] }
# Preserve libwayland-server diagnostics (including internal protocol and
# client I/O errors) in ShojiWM's tracing log when using Smithay's system-lib
# backend.
wayland-backend = { version = "0.3.15", features = ["log"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
bumpalo = { version = "3.20.2", features = ["allocator-api2"] }
hashbrown = { version = "0.15.5", features = ["allocator-api2"] }
input = "0.10.0"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
# Moves log writes off the compositor thread; see `init_logging` for why a
# synchronous writer is a hazard here.
tracing-appender = "0.2.3"
xkbcommon = "0.9.0"
xcursor = "0.3.10"
cgmath = "0.18.0"
fontdb = "0.16.2"
fontdue = "0.9.3"
cosmic-text = "0.17.2"
png = "0.17.16"
resvg = "0.45.1"
mimalloc = "0.1.52"
# Direct calloop dep with the `signals` feature so the embedded TypeScript
# runtime can wake the compositor after IPC-driven state changes.
calloop = { version = "0.14.0", features = ["signals"] }
# Used at the very top of main() to block SIGUSR1 process-wide so the signalfd
# source in calloop receives it deterministically (without random threads
# catching it before we can read).
libc = "0.2"
timescope = "0.1.3"
# web_stub, not web: `web` is one of rustyscript's network_extensions and pulls
# deno_net/deno_fetch/deno_tls, so rustls, ring, reqwest and quinn end up in a
# compositor. IPC sockets are our own ops instead. console and fs_import were
# supplied transitively by `web` and are still needed -- without fs_import the
# module loader rejects every file: specifier.
#
# `url` is mandatory even though nothing here uses URL: web_stub registers
# ext:deno_web/00_url.js and 01_urlpattern.js but its own init_stub.js never
# imports them, and only the url feature's init_url.js does. Without it every
# runtime fails to construct with "Following modules were not evaluated".
rustyscript = { git = "https://github.com/rscarson/rustyscript.git", rev = "ef6ccee0eb45378dba540ebe78005f05ed3aa81b", default-features = false, features = ["web_stub", "console", "url", "fs_import"] }
# The op2 macro expands against the deno_core crate name directly.
deno_core = "=0.380.1"
# net/io-util/macros are for the IPC socket ops. They only resolved before
# because deno_core unifies tokio to "full"; name them so a dependency bump
# can't silently remove them.
tokio = { version = "1.47.1", features = ["sync", "net", "io-util", "macros"] }
# V8 142's Temporal implementation requires the ICU 2.1 API. RustyScript's
# upstream lockfile pins this set, but its published dependency ranges also
# admit incompatible ICU 2.2 releases.
icu_calendar = "=2.1.1"
icu_normalizer = "=2.1.1"
icu_properties = "=2.1.2"
idna_adapter = "=1.2.1"

[features]
# Hardened allocator for chasing heap corruption:
# `secure` adds guard pages and encoded free lists so a
# use-after-free write aborts at the faulting site instead of corrupting
# state that detonates later; `debug` adds mimalloc's internal assertions.
# Build with `cargo build --release --features heap-debug` and reproduce.
heap-debug = ["mimalloc/secure", "mimalloc/debug"]
